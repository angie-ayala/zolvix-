<!-- =================================================== -->
<!-- BOTÓN FAB - ESQUINA INFERIOR DERECHA               -->
<!-- =================================================== -->
<button class="bicibot-fab" (click)="toggleChat()" *ngIf="!isChatOpen" aria-label="Abrir BiciBot IA">
  <ion-icon name="chatbubbles"></ion-icon>
  <span class="fab-badge">IA</span>
</button>

<!-- =================================================== -->
<!-- PANEL DE CHAT FLOTANTE                              -->
<!-- =================================================== -->
<div class="bicibot-chat-panel" *ngIf="isChatOpen">

  <!-- Header -->
  <div class="chat-panel-header">
    <div class="chat-header-info">
      <div class="chat-avatar">
        <ion-icon name="bicycle"></ion-icon>
      </div>
      <div>
        <h4>BiciBot IA 🚲</h4>
        <span class="chat-status">🟢 En línea · Asistente ciclista</span>
      </div>
    </div>
    <div class="chat-header-actions">
      <button class="hdr-btn" (click)="clearChat()" title="Limpiar conversación" aria-label="Limpiar chat">
        <ion-icon name="trash-outline"></ion-icon>
      </button>
      <button class="hdr-btn hdr-btn-close" (click)="toggleChat()" title="Cerrar" aria-label="Cerrar chat">
        <ion-icon name="close"></ion-icon>
      </button>
    </div>
  </div>

  <!-- Cuerpo de mensajes -->
  <div class="chat-panel-body" #chatBody>

    <!-- Bienvenida cuando no hay mensajes -->
    <div class="chat-welcome" *ngIf="chatMessages.length === 0">
      <div class="welcome-icon">🚲</div>
      <p>¡Hola! Soy <strong>BiciBot</strong>, tu asistente de BiciMap.<br>Te ayudo con rutas, reportes, parqueaderos y más.</p>
    </div>

    <!-- Chips de sugerencias rápidas -->
    <div class="chat-suggestions" *ngIf="chatMessages.length === 0">
      <button
        class="sug-chip"
        *ngFor="let sug of chatSuggestions"
        (click)="sendChatFromSuggestion(sug)">
        {{ sug }}
      </button>
    </div>

    <!-- Mensajes -->
    <div
      *ngFor="let msg of chatMessages"
      class="chat-msg"
      [class.chat-msg-user]="msg.role === 'user'"
      [class.chat-msg-bot]="msg.role === 'assistant'">

      <div class="chat-msg-avatar" *ngIf="msg.role === 'assistant'">🚲</div>

      <div class="chat-msg-bubble">
        <p>{{ msg.content }}</p>
        <span class="chat-msg-time">{{ msg.timestamp | date:'shortTime' }}</span>
      </div>
    </div>

    <!-- Indicador "escribiendo..." -->
    <div class="chat-msg chat-msg-bot" *ngIf="isChatLoading">
      <div class="chat-msg-avatar">🚲</div>
      <div class="chat-msg-bubble typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <!-- Footer / input -->
  <div class="chat-panel-footer">
    <input
      type="text"
      class="chat-text-input"
      [(ngModel)]="chatInput"
      placeholder="Escríbeme algo..."
      (keydown.enter)="sendChatMessage()"
      [disabled]="isChatLoading"
      autocomplete="off" />
    <button
      class="send-btn"
      (click)="sendChatMessage()"
      [disabled]="!chatInput || !chatInput.trim() || isChatLoading"
      aria-label="Enviar mensaje">
      <ion-icon name="send"></ion-icon>
    </button>
  </div>

</div>
